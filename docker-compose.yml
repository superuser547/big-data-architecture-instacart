services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instacart
      POSTGRES_USER: instacart
      POSTGRES_PASSWORD: instacart_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instacart -d instacart"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: .
    command:
      - uv
      - run
      - streamlit
      - run
      - src/instacart/dashboard/app.py
      - --server.address=0.0.0.0
    environment:
      DATABASE_URL: postgresql://instacart:instacart_local@postgres:5432/instacart
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dashboard"]

volumes:
  postgres_data:
